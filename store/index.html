<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e4e2dc" />
    <title>MY STORE</title>
    <meta name="description" content="متجر افتراضي ثلاثي الأبعاد: تجوّل بين القطع، قلّبها، واطلبها بالدفع عند الاستلام." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MY STORE" />
    <meta property="og:description" content="متجر افتراضي ثلاثي الأبعاد: تجوّل بين القطع، قلّبها، واطلبها بالدفع عند الاستلام." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:ital,wght@0,400;0,600;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- شاشة تحميل فورية: تظهر قبل أن يُحمَّل أي كود، وتختفي عندما يجهز المتجر -->
    <style>
      html, body { margin: 0; background: #e4e2dc; }
      #boot {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background: #e4e2dc; transition: opacity 0.5s ease;
      }
      #boot.hide { opacity: 0; pointer-events: none; }
      #boot .bar { width: 120px; height: 2px; overflow: hidden; border-radius: 2px; background: rgba(0, 0, 0, 0.12); }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #111; animation: boot-bar 1.1s ease-in-out infinite; }
      @keyframes boot-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="bar"><i></i></div></div>
    <div id="root"></div>
    <noscript>
      <p style="position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#e4e2dc;font:600 16px sans-serif;text-align:center;padding:24px">
        يحتاج هذا المتجر إلى تفعيل JavaScript في المتصفح.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
